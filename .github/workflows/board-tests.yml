name: Quarto board and MathJax tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: board-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Install isolated browser test dependencies
        timeout-minutes: 5
        run: |
          npm install --prefix "$RUNNER_TEMP/board-tests" playwright@1.55.1 mathjax@4.1.3
      - name: Install browser system dependencies
        timeout-minutes: 5
        run: |
          # The runner's Azure mirror can stall for minutes per font package.
          # Use Ubuntu's official archive for this supported Playwright image.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          "$RUNNER_TEMP/board-tests/node_modules/.bin/playwright" install-deps chromium firefox webkit
      - name: Install browsers
        timeout-minutes: 5
        run: |
          "$RUNNER_TEMP/board-tests/node_modules/.bin/playwright" install chromium firefox webkit
      - name: Full suite with real rendered frames and MathJax
        run: |
          export JXG_TEST_PLAYWRIGHT="$RUNNER_TEMP/board-tests/node_modules/playwright/index.mjs"
          export MATHJAX_DIR="$RUNNER_TEMP/board-tests/node_modules/mathjax"
          export JXG_TEST_BROWSERS=chromium,firefox,webkit
          node --test
